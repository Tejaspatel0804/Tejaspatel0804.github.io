<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09111f"><title>Tejas • Daily Greeting</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="lock" class="screen lock-screen"><div class="lock-card">
<div class="lock-logo">T</div><h1>Welcome</h1><p>Enter your password to continue</p>
<div class="password-row"><input id="password" type="password" placeholder="Password"><button id="unlock">→</button></div><div id="error"></div>
</div></div>
<div id="world" class="world" hidden><div class="sky-glow"></div><div class="sun"></div><div class="moon"></div>
<div class="stars" id="stars"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div>
<div class="birds" id="birds"></div><div class="sparkles" id="sparkles"></div>
<div class="content"><div class="date" id="date"></div><div class="greeting" id="greeting"></div><div class="subtitle" id="subtitle"></div><div class="time" id="time"></div><button class="enter-btn" id="relock">Lock</button></div>
<div class="land"><div class="hill hill-back"></div><div class="hill hill-front"></div><div class="grass"></div><div class="flowers" id="flowers"></div></div>
</div><script src="app.js"></script></body></html>
