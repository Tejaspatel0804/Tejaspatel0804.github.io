<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tejas Daily Greeting</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;color:#fff}body{background:#07111f}.lock{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#284d80,#07111f 70%);z-index:9}.card{width:min(390px,90%);padding:30px 24px;text-align:center;border:1px solid #fff3;border-radius:28px;background:#ffffff12;backdrop-filter:blur(18px)}h1{margin:8px 0}.logo{font-size:52px}.sub{color:#ccd6e5}input,button{width:100%;padding:15px;border-radius:15px;font:inherit}input{background:#0005;color:white;border:1px solid #fff4}button{margin-top:10px;border:0;font-weight:800}.err{height:22px;color:#ffb0b0;margin-top:8px}.app{display:none;height:100%;position:relative;overflow:hidden}.sky{position:absolute;inset:0;transition:background 1s}.orb{position:absolute;width:125px;height:125px;border-radius:50%;right:9%;top:12%;animation:float 5s ease-in-out infinite}.sun{background:#ffd84d;box-shadow:0 0 60px #ffd84daa}.moon{background:#eef5ff;box-shadow:0 0 50px #bcd7ff99}.content{position:absolute;z-index:3;top:12%;width:100%;text-align:center;padding:20px}.greet{font-size:clamp(42px,11vw,72px);font-weight:900;text-shadow:0 4px 25px #0005}.msg{font-size:18px}.clock{font-size:21px;font-weight:700;margin-top:18px}.date{opacity:.75}.cloud{position:absolute;width:125px;height:35px;border-radius:40px;background:#fff9;top:25%;left:-150px;z-index:2;animation:cloud 25s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:55px;height:55px;left:20px;bottom:5px}.cloud:after{width:70px;height:70px;right:15px;bottom:0}.c2{top:38%;animation-delay:-12s;transform:scale(.7)}.stars{position:absolute;inset:0}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:white;animation:twinkle 2s infinite}.land{position:absolute;z-index:2;bottom:-8%;left:-5%;width:110%;height:30%;background:#16352f;border-radius:50% 50% 0 0/25% 25% 0 0}.flower{position:absolute;z-index:3;bottom:18%;font-size:30px;animation:float 2s ease-in-out infinite}.f1{left:12%}.f2{left:28%;animation-delay:.5s}.f3{right:18%;animation-delay:1s}.f4{right:34%;animation-delay:.2s}.actions{position:absolute;z-index:5;bottom:20px;left:0;right:0;text-align:center}.actions button{width:auto;padding:10px 16px;margin:4px;background:#0004;color:#fff;border:1px solid #fff4}.birds{position:absolute;z-index:2;top:30%;left:-10%;font-size:26px;animation:fly 15s linear infinite}@keyframes float{50%{transform:translateY(10px)}}@keyframes cloud{to{left:110%}}@keyframes fly{to{left:110%}}@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
</style></head><body>
<div class="lock" id="lock"><div class="card"><div class="logo">🌅</div><h1>Welcome, Tejas</h1><p class="sub">Enter your password to continue</p><input id="pw" type="password" placeholder="Password"><button id="enter">Enter</button><div class="err" id="err"></div></div></div>
<div class="app" id="app"><div class="sky" id="sky"></div><div class="stars" id="stars"></div><div class="orb" id="orb"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="birds">⌁⌁⌁</div><div class="content"><div class="greet" id="greet"></div><div class="msg" id="msg"></div><div class="clock" id="clock"></div><div class="date" id="date"></div></div><div class="land"></div><div class="flower f1">🌼</div><div class="flower f2">🌷</div><div class="flower f3">🌻</div><div class="flower f4">🌸</div><div class="actions"><button id="refresh">Refresh scene</button><button id="logout">Lock</button></div></div>
<script>
const PASSWORD='tejas';const $=id=>document.getElementById(id);function unlock(){if($('pw').value===PASSWORD){sessionStorage.setItem('unlocked','1');$('lock').style.display='none';$('app').style.display='block';update()}else{$('err').textContent='Incorrect password';$('pw').select()}}function lock(){sessionStorage.removeItem('unlocked');$('app').style.display='none';$('lock').style.display='grid';$('pw').value='';$('pw').focus()}function update(){let h=new Date().getHours(),type=h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=17&&h<21?'evening':'night';let data={morning:['Good Morning ☀️','A fresh day. A fresh start. ✨','linear-gradient(#69c9ff,#bcecff,#ffd9a8)','sun'],afternoon:['Good Afternoon 🌤️','Keep going — you’ve got this. 💪','linear-gradient(#36aef0,#9ee2ff,#ffe0a8)','sun'],evening:['Good Evening 🌇','Slow down, breathe, and enjoy the evening. 🌆','linear-gradient(#ee765c,#f5a05e,#382c59)','sun'],night:['Good Night 🌙','Rest well. Tomorrow is another chance. ✨','linear-gradient(#020817,#08152e,#172544)','moon']}[type];$('greet').textContent=data[0];$('msg').textContent=data[1];$('sky').style.background=data[2];$('orb').className='orb '+data[3];$('stars').innerHTML='';if(type==='night')for(let i=0;i<75;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*2+'s';$('stars').appendChild(s)}let n=new Date();$('clock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=n.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'})}$('enter').onclick=unlock;$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};$('logout').onclick=lock;$('refresh').onclick=update;if(sessionStorage.getItem('unlocked')==='1'){$('lock').style.display='none';$('app').style.display='block';update()}setInterval(update,1000);
</script></body></html>
